name: ci

on:
  pull_request:

permissions:
  actions: read
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: 🌿 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: bunx nx record -- bunx nx format:check  --base="remotes/origin/main"

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - name: Distribute tasks with Nx Cloud
        run: bunx nx start-ci-run --distribute-on="3 linux-medium-js-bun" --stop-agents-after="lint,test,build,typecheck"

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: bun install

      # - run: bun nx-cloud record -- echo Hello World
      - name: Validate
        run: bun validate:affected

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - name: Self-heal CI
        run: bun nx fix-ci
        if: always()
